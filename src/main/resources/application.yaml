spring:
  application:
    name: TF_Java_2026_IntroSpringAPI
  datasource:
    url: jdbc:postgresql://localhost:5432/intro_spring_api
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:migration
    default-schema: public
    schemas: public

logging:
  file:
    path: logs
  level:
    root: INFO
server:
  port: 8080